name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Build archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cargo build --locked --release --target "$TARGET"
          staging="ctrm-${version}-${TARGET}"
          mkdir "$staging"
          test "$(target/${TARGET}/release/ctrm --version)" = "characterminator ${version}"
          cp "target/${TARGET}/release/ctrm" LICENSE README.md "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ctrm-*.tar.gz

  upload:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd assets
          shasum -a 256 *.tar.gz > SHA256SUMS
          gh release upload --clobber "$TAG" *.tar.gz SHA256SUMS
