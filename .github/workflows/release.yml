name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true
        type: string

# Only the upload writes. The build jobs compile third-party crates, whose
# build scripts run with whatever token the job holds, so they get read.
permissions:
  contents: read

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # The compiler the gate tested, as in action.yml: rustc 1.95.0, the
      # MSRV and the rustc flake.lock pins. The runner's own Rust is
      # whatever the image shipped that week. Bump it with the flake's
      # rustc and action.yml, in the same commit.
      - name: Build archive
        env:
          RUSTUP_TOOLCHAIN: "1.95.0"
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --target "$TARGET"
          version="${TAG#v}"
          cargo build --locked --release --target "$TARGET"
          staging="ctrm-${version}-${TARGET}"
          mkdir "$staging"
          test "$(target/${TARGET}/release/ctrm --version)" = "characterminator ${version}"
          cp "target/${TARGET}/release/ctrm" LICENSE README.md "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: ctrm-*.tar.gz

  upload:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      # No checkout here, so `gh` has no git remote to infer the repository
      # from: `GH_REPO` names it.
      - name: Upload release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd assets
          shasum -a 256 *.tar.gz > SHA256SUMS
          gh release upload --clobber "$TAG" *.tar.gz SHA256SUMS
