# One workspace, two crates: the product, and `dev/` (`characterminator-dev`),
# the unpublished tooling that maintains this repository's generated docs
# (`dev:V131`). A second `[[bin]]` here would have shipped in the tarball and
# landed on a consumer's PATH; a separate, `publish = false` member cannot.
# Cargo leaves a member's directory out of the root package on its own, and
# `include` below would refuse it anyway.
[workspace]
members = ["dev"]

[package]
# The CRATE carries the meaning, the BINARY carries the muscle memory --
# `ripgrep`/`rg` and `microlith`/`mth` are the established Rust CLI shape.
# `ctr` was the first choice and is taken: containerd ships `cmd/ctr`, so it
# is on most Docker and Kubernetes hosts.
name = "characterminator"
# 0.1.0: the first release -- `check`, `fix`, `stats`, `explain` and `sets`
# work; the rest of SPEC.md's backlog does not ship yet. The number moves
# when a milestone's done-when is met, never to mark effort.
version = "0.1.0"
edition = "2024"
# The floor is the toolchain the gate actually runs: the fleet's one nixpkgs
# authority (nixos-26.05) carries rustc 1.95.0. Declaring a higher number
# would be a floor nothing here is ever compiled against.
rust-version = "1.95"
license = "MIT"
description = "find and eliminate characters outside an allowed set, per file type and per file, so text costs fewer tokens"
readme = "README.md"
repository = "https://github.com/pr0d1r2/characterminator"
documentation = "https://docs.rs/characterminator"
keywords = ["unicode", "ascii", "tokens", "lint", "agents"]
categories = ["command-line-utilities", "development-tools"]
# What ships to crates.io. The SOURCE and the SPECS (the spec is the law,
# so a reader of the crate gets the rules with the code), the data files
# compiled in, the integration tests, and the reader-facing docs. The dev
# tooling -- nix flake, hk gate, vendored pkl schema, CI, coverage and
# token-limit bookkeeping -- stays in the repository: a crate consumer
# never runs it, and shipping it would only look like part of the API.
include = [
    "/src/**/*",
    "/tests/**/*",
    "/docs/**/*",
    "/SPEC.md",
    "/SPEC-ARCHIVE.md",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
]

# Two names on purpose: `characterminator` is what you depend on, `ctrm` is
# what you run. Paths and manifests take the crate name, anything invoked
# takes the binary name.
[[bin]]
name = "ctrm"
path = "src/main.rs"

# ONE token authority for the fleet, called rather than reimplemented: a
# saving reported by `ctrm` has to be the same number `itok` reports, and
# two counters drift the moment either changes. `src/tokens` is its sole
# call site (`src:C`, `src/tokens:C`), so the blast radius of this dep is
# one module.
#
# `default-features = false` drops the `session` feature, which pulls serde
# and a toml parser to read agent transcripts -- a thing this crate never
# does. `bpe` is kept because it IS the real-tokenizer tier: without it the
# only count available is bytes/4, and `stats --bpe` would have to claim a
# measurement nothing here can make (`src/tokens:V10`).
[dependencies]
itok = { version = "0.3", default-features = false, features = ["bpe"] }

# The Unicode tables the four data-bound pedantic lints read
# (`src/lint/pedantic:V58`): normalization (`not-nfc`, `nfkc-compat`) and
# UTS #39 (`mixed-script`'s resolved script set, `confusable`'s skeleton).
# Published tables, called rather than re-vendored: a private copy of a
# decomposition or confusables table is a second definition that drifts.
# `src/lint/pedantic/ucd.rs` is their only call site (`src:C`).
# `unicode-script` arrives beneath `unicode-security` and is not named,
# because nothing here calls it directly.
#
# `default-features = false`: `unicode-normalization` drops `std` (alloc is
# enough); `unicode-security` has no default features, said anyway so a
# later default cannot arrive unreviewed.
unicode-normalization = { version = "0.1.25", default-features = false }
unicode-security = { version = "0.1.2", default-features = false }

# ONE lint table for the workspace, so the dev tooling meets exactly the
# denials the product does (`dev:C`) rather than a laxer copy.
[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
# The library surface is the root re-export list and nothing else
# (`src:V98`). A `pub` inside a private node is a promise nobody can
# reach, and it hides the dead code a narrower visibility surfaces.
unreachable_pub = "deny"

# Deny rather than warn: a warning in a gate that runs with `-D warnings` is
# a denial with extra steps, and spelling it here keeps `cargo clippy` honest
# outside the gate too.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
